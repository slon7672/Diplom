[pytest]
markers =
    smoke: Критически важные тесты для быстрой проверки
    positive: Позитивные тест-кейсы
    deletion: тесты на удаление
    negative: негативные сценарии
    aut: авторизация
    creation: тесты на создание
    duplicate: проверка дублей
    rename: переименование
    get_project: получение проекта по ID
    get_projects: получение списка проектов
    ui: Тесты пользовательского интерфейса (Selenium)
    api: Тесты программного интерфейса (API)
    positive: Позитивные тесты
    negative: Негативные тесты
    aut: Тесты авторизации
    company: Тесты компаний
    messenger: Тесты мессенджера
    event: Тесты событий
    projects: Тесты проектов
    boards: Тесты досок
    columns: Тесты колонок
    tasks: Тесты задач

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -s --tb=short --alluredir=allure-results